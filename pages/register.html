<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO & Social -->
    <title>Daftar — NgeCafu Yukk</title>
    <meta name="description" content="Buat akun toko kopi baru di NgeCafu Yukk." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Shared Auth Styles -->
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body>
    <!-- Skip-to-content -->
    <a class="skip-link" href="#main-content">Lewati ke konten utama</a>

    <!-- Decorative background -->
    <div class="page-bg" aria-hidden="true"></div>

    <!-- ═══════════════════════════════════════════════════
       AUTH CARD
       ═══════════════════════════════════════════════════ -->
    <div class="auth-card" role="main">

        <!-- ───────── LEFT: Branding aside ───────── -->
        <aside class="hero-panel" aria-label="Branding NgeCafu Yukk">
            <div class="d-flex align-items-center gap-3 mb-2">
                <div class="hero-logo" aria-hidden="true">
                    <img src="../assets/images/main_icon.png" alt="" class="main_logo">
                </div>
                <div>
                    <p class="hero-title">Bergabung</p>
                    <p class="hero-brand">NgeCafu Yukk</p>
                </div>
            </div>
            <p class="hero-tagline">
                Daftarkan toko kopi Anda<br>
                dan mulai berjualan!
            </p>
        </aside>

        <!-- ───────── RIGHT: Register form ───────── -->
        <section class="form-panel" id="main-content">

            <header>
                <h1 class="form-heading">Buat Akun Baru</h1>
                <p class="form-subheading">Daftarkan toko Anda di NgeCafu Yukk</p>
            </header>

            <!-- Alert banner -->
            <div id="regAlert" class="alert-banner" role="alert" aria-live="polite"></div>

            <form id="registerForm" novalidate aria-label="Formulir pendaftaran" class="mt-3">

                <!-- Nama Toko -->
                <div class="mb-3">
                    <label class="form-label" for="regName">Nama Toko</label>
                    <input type="text" class="form-control" id="regName" name="store_name" placeholder="Nama toko Anda"
                        required autocomplete="organization" aria-required="true" aria-describedby="regNameError" />
                    <span class="field-error" id="regNameError" role="alert"></span>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label" for="regEmail">Email</label>
                    <input type="email" class="form-control" id="regEmail" name="email" placeholder="nama@toko.com"
                        required autocomplete="email" aria-required="true" aria-describedby="regEmailError" />
                    <span class="field-error" id="regEmailError" role="alert"></span>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label" for="regPassword">Password</label>
                    <div class="input-group" aria-describedby="regPassError">
                        <input type="password" class="form-control" id="regPassword" name="password"
                            placeholder="Min. 6 karakter" required autocomplete="new-password" aria-required="true"
                            minlength="6" />
                        <button type="button" class="btn-eye" onclick="togglePass('regPassword', this)"
                            aria-label="Tampilkan password">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span class="field-error" id="regPassError" role="alert"></span>
                </div>

                <!-- Konfirmasi Password -->
                <div class="mb-4">
                    <label class="form-label" for="regConfirm">Konfirmasi Password</label>
                    <div class="input-group" aria-describedby="regConfirmError">
                        <input type="password" class="form-control" id="regConfirm" name="confirm_password"
                            placeholder="Ulangi password" required autocomplete="new-password" aria-required="true" />
                        <button type="button" class="btn-eye" onclick="togglePass('regConfirm', this)"
                            aria-label="Tampilkan konfirmasi password">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span class="field-error" id="regConfirmError" role="alert"></span>
                </div>

                <button type="submit" class="btn-primary-green">
                    <i class="bi bi-person-plus me-2" aria-hidden="true"></i>
                    Daftar Sekarang
                </button>
            </form>

            <div class="divider-or" aria-hidden="true">atau</div>

            <p class="switch-text">
                Sudah punya akun?
                <a href="login.html" class="switch-link">Masuk Sekarang</a>
            </p>

            <footer>
                <small class="copyright">© 2026 Tugas PAP – NgeCafe</small>
            </footer>

        </section>
        <!-- /form-panel -->

    </div>
    <!-- /auth-card -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/register.js"></script>
</body>

</html>
