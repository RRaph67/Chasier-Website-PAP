<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pesanan - NgeCafe</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="dashboard-body">

    <div class="dashboard-wrapper d-flex min-vh-100 w-100">

        <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebarOffcanvas"
            aria-label="Sidebar Navigasi">
            <div class="d-flex align-items-center justify-content-between px-3 py-4">
                <div class="sidebar-brand d-flex align-items-center gap-2">
                    <div class="rounded-circle d-flex align-items-center justify-content-center"
                        style="width: 60px; height: 60px; flex-shrink: 0;">
                        <div class="hero-logo d-flex justify-content-center align-items-center" aria-hidden="true">
                            <img src="../assets/images/main_icon.png" alt="" class="main_logo w-75">
                        </div>
                    </div>
                    <div>
                        <h2 class="fs-5 fw-bold text-white m-0 py-1">NgeCafe</h2>
                        <small class="text-white-50 d-block" style="font-size: 0.7rem; line-height: 1;">Pokoknya
                            Nyaman</small>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                    data-bs-target="#sidebarOffcanvas" aria-label="Close"></button>
            </div>

            <nav class="sidebar-nav d-flex flex-column gap-1 px-2" aria-label="Menu Utama">
                <p class="nav-section-title px-3 mt-2 mb-1">General</p>

                <a href="./dashboard_chasier.html" class="nav-link">Dashboard <i
                        class="bi bi-chevron-right ms-auto"></i></a>

                <a href="./opPengguna.html" class="nav-link">Operasional <i class="bi bi-chevron-right ms-auto"></i></a>

                <a href="./status_pesanan.html" class="nav-link active" aria-current="page">Status Pesanan <i
                        class="bi bi-chevron-right ms-auto"></i></a>

                <a href="./profile.html" class="nav-link">Profile <i class="bi bi-chevron-right ms-auto"></i></a>

                <p class="nav-section-title px-3 mt-4 mb-1">Akun</p>
                <a href="login.html" class="nav-link text-danger-hover">Keluar <i
                        class="bi bi-box-arrow-right ms-auto"></i></a>
            </nav>
        </aside>

        <main class="main-content flex-grow-1 d-flex flex-column min-w-0" role="main">

            <header
                class="mobile-header d-flex d-lg-none align-items-center justify-content-between bg-white rounded-3 p-2 px-3 shadow-sm mt-3 mx-3 mb-2"
                aria-label="Header Mobile">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-link p-0 text-dark" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#sidebarOffcanvas" aria-label="Buka Menu">
                        <i class="bi bi-list fs-2"></i>
                    </button>
                    <h1 class="m-0 fs-4 fw-bold text-success-dark">NgeCafe</h1>
                </div>
                <a href="profile.html" aria-label="Lihat Profil">
                    <img src="../assets/images/avatar.png" alt="Profile" class="rounded-circle" width="40" height="40"
                        style="object-fit: cover;">
                </a>
            </header>

            <header
                class="desktop-topbar d-none d-lg-flex align-items-center justify-content-between bg-white rounded-3 p-2 px-4 shadow-sm mt-3 mx-4 mb-2">
                <div class="invisible">Placeholder</div>
                <a href="profile.html" aria-label="Lihat Profil">
                    <img src="../assets/images/avatar.png" alt="Profile" class="rounded-circle" width="40" height="40"
                        style="object-fit: cover;">
                </a>
            </header>

            <section class="p-3 p-lg-4 flex-grow-1 overflow-auto">
                <header class="mb-4">
                    <h2 class="fs-4 fw-bold text-success-dark mb-1">Status Pesanan</h2>
                    <p class="text-secondary small">Pantau progres pesanan Anda secara real-time</p>
                </header>

                <div class="row g-4">

                    <section class="col-12 col-lg-6" aria-labelledby="siap-diambil-heading">
                        <div class="card border-0 shadow-sm rounded-4 h-100">
                            <header
                                class="bg-success-dark text-white p-3 rounded-top-4 d-flex justify-content-between align-items-center">
                                <h3 id="siap-diambil-heading" class="fs-6 fw-semibold m-0">Siap Diambil</h3>
                                <span class="badge bg-white text-success-dark rounded-circle px-2 py-1"
                                    id="countReady">0</span>
                            </header>

                            <div class="card-body bg-light-gray rounded-bottom-4 p-3 d-flex flex-column gap-3"
                                id="listSiapDiambil">
                            </div>
                        </div>
                    </section>

                    <section class="col-12 col-lg-6" aria-labelledby="sedang-disiapkan-heading">
                        <div class="card border-0 shadow-sm rounded-4 h-100">
                            <header
                                class="bg-success-muted text-success-dark p-3 rounded-top-4 d-flex justify-content-between align-items-center">
                                <h3 id="sedang-disiapkan-heading" class="fs-6 fw-semibold m-0">Sedang Disiapkan</h3>
                                <span class="badge bg-success-dark text-white rounded-circle px-2 py-1"
                                    id="countPreparing">0</span>
                            </header>

                            <div class="card-body rounded-bottom-4 p-3 border border-top-0 border-light-subtle">
                                <div class="row g-3 mb-4" id="listSedangDisiapkan">
                                </div>

                                <div class="text-center mt-4">
                                    <hr class="border-secondary border-1 opacity-25 border-dashed mb-3">
                                    <p class="text-secondary small">Menunggu pesanan<br>baru...</p>
                                </div>
                            </div>
                        </div>
                    </section>

                </div>
            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/statusPesanan.js"></script>
</body>

</html>
