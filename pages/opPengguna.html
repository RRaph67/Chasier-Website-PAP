<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operasional — NgeCafe</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="../assets/css/style.css" />
</head>

<body class="dashboard-body">

    <div class="dashboard-wrapper d-flex min-vh-100 w-100">

        <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebarOffcanvas"
            aria-label="Sidebar Navigasi">
            <div class="d-flex align-items-center justify-content-between px-3 py-4">
                <div class="sidebar-brand d-flex align-items-center gap-2">
                    <div class="rounded-circle d-flex align-items-center justify-content-center"
                        style="width: 60px; height: 60px; flex-shrink: 0;">
                        <div class="hero-logo d-flex justify-content-center align-items-center" aria-hidden="true">
                            <img src="../assets/images/main_icon.png" alt="" class="main_logo w-75">
                        </div>
                    </div>
                    <div>
                        <h2 class="fs-5 fw-bold text-white m-0 py-1">NgeCafe</h2>
                        <small class="text-white-50 d-block" style="font-size: 0.7rem; line-height: 1;">Pokoknya
                            Nyaman</small>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas"
                    data-bs-target="#sidebarOffcanvas" aria-label="Close"></button>
            </div>

            <nav class="sidebar-nav d-flex flex-column gap-1 px-2" aria-label="Menu Utama">
                <p class="nav-section-title px-3 mt-2 mb-1">General</p>
                <a href="./dashboard_chasier.html" class="nav-link">Dashboard <i
                        class="bi bi-chevron-right ms-auto"></i></a>
                <a href="./opPengguna.html" class="nav-link active" aria-current="page">Operasional <i
                        class="bi bi-chevron-right ms-auto"></i></a>
                <a href="./status_pesanan.html" class="nav-link">Status Pesanan <i
                        class="bi bi-chevron-right ms-auto"></i></a>
                <a href="./profile.html" class="nav-link">Profile <i class="bi bi-chevron-right ms-auto"></i></a>

                <p class="nav-section-title px-3 mt-4 mb-1">Akun</p>
                <a href="login.html" class="nav-link text-danger-hover">Keluar <i
                        class="bi bi-box-arrow-right ms-auto"></i></a>
            </nav>
        </aside>

        <main class="main-content flex-grow-1 d-flex flex-column min-w-0" role="main">

            <header
                class="mobile-header d-flex d-lg-none align-items-center justify-content-between bg-white rounded-3 p-2 px-3 shadow-sm mt-3 mx-3 mb-2"
                aria-label="Header Mobile">
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-link p-0 text-dark" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#sidebarOffcanvas" aria-label="Buka Menu">
                        <i class="bi bi-list fs-2"></i>
                    </button>
                    <h1 class="m-0 fs-4 fw-bold text-success-dark">NgeCafe</h1>
                </div>
                <a href="profile.html" aria-label="Lihat Profil">
                    <img src="../assets/images/avatar.png" alt="Profile" class="rounded-circle" width="40" height="40"
                        style="object-fit: cover;">
                </a>
            </header>

            <header
                class="desktop-topbar d-none d-lg-flex align-items-center justify-content-between bg-white rounded-3 p-2 px-4 shadow-sm mt-3 mx-4 mb-2">
                <div class="invisible">Placeholder</div>
                <a href="profile.html" aria-label="Lihat Profil">
                    <img src="../assets/images/avatar.png" alt="Profile" class="rounded-circle" width="40" height="40"
                        style="object-fit: cover;">
                </a>
            </header>


            <div class="p-3 p-lg-4 pt-lg-2 flex-grow-1 overflow-auto">
                <div class="row g-4">

                    <section class="col-12 col-lg-8" aria-labelledby="produk-heading">
                        <div class="bg-white rounded-4 p-3 p-lg-4 shadow-sm h-100">
                            <header class="d-flex justify-content-between align-items-center mb-3">
                                <h2 id="produk-heading" class="fs-5 fw-bold text-secondary-dark m-0">PRODUK</h2>
                                <a href="#" class="text-success text-decoration-none fw-semibold fs-6">View All</a>
                            </header>

                            <div class="input-group mb-4">
                                <span class="input-group-text bg-light border-end-0 rounded-start-3">
                                    <i class="bi bi-search text-muted"></i>
                                </span>
                                <input type="text" class="form-control bg-light border-start-0 rounded-end-3"
                                    placeholder="Cari produk..." aria-label="Cari produk">
                            </div>

                            <div class="row row-cols-2 row-cols-md-3 g-3" id="productGrid">
                            </div>
                        </div>
                    </section>

                    <aside class="col-12 col-lg-4" aria-labelledby="keranjang-heading">
                        <div class="bg-white rounded-4 p-3 p-lg-4 shadow-sm d-flex flex-column h-100">
                            <header class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                                <h2 id="keranjang-heading" class="fs-6 fw-bold text-secondary-dark m-0">KERANJANG</h2>
                                <button type="button" class="btn btn-sm btn-danger-soft fw-semibold"
                                    onclick="clearCart()">Kosongkan</button>
                            </header>

                            <div id="cartItems" class="flex-grow-1 overflow-auto mb-3" style="min-height: 200px;">
                                <div class="text-center text-muted mt-5" id="emptyCartState">
                                    <i class="bi bi-cart3" style="font-size: 3rem; color: #adb5bd;"></i>
                                    <p class="mt-2 text-secondary" style="font-size: 0.9rem;">Keranjang kosong.<br>Pilih
                                        produk di sebelah kiri.</p>
                                </div>
                            </div>

                            <section class="payment-section border-top pt-3" aria-label="Ringkasan Pembayaran">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="text-secondary small">Subtotal</span>
                                    <span class="small fw-semibold" id="cartSubtotal">Rp 0</span>
                                </div>
                                <div class="d-flex justify-content-between mb-3 border-bottom pb-3">
                                    <span class="fw-bold">Total</span>
                                    <span class="fw-bold text-success fs-5" id="cartTotal">Rp 0</span>
                                </div>

                                <div class="mb-3">
                                    <label for="inputBayar" class="form-label text-secondary small fw-bold mb-1">JUMLAH
                                        BAYAR</label>
                                    <input type="number" class="form-control bg-light" id="inputBayar" placeholder="0"
                                        oninput="calculateChange()">
                                </div>

                                <div
                                    class="d-flex justify-content-between align-items-center p-2 rounded bg-success-light mb-3">
                                    <span class="fw-bold text-success-dark small">Kembalian</span>
                                    <span class="fw-bold text-success-dark" id="textKembalian">-</span>
                                </div>

                                <button type="button"
                                    class="btn-primary-green w-100 d-flex align-items-center justify-content-center gap-2"
                                    onclick="processTransaction()">
                                    <i class="bi bi-check-lg"></i> Proses Transaksi
                                </button>
                            </section>
                        </div>
                    </aside>

                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/opPengguna.js"></script>
</body>

</html>
